name: Quality (a11y · content · SEO · Lighthouse)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  a11y-content-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run accessibility + content guardrail + SEO tests
        env:
          CI: "1"
          A11Y_REPORT_DIR: a11y-report
        run: bun run test:a11y
      - name: Upload accessibility report (JSON + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run Lighthouse CI (mobile)
        run: bunx @lhci/cli@0.14.x autorun --config=./lighthouserc.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report