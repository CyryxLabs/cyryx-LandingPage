name: Quality (a11y · content · SEO · Lighthouse)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_jsonld_snapshot:
        description: "Regenerate the schema.org JSON-LD snapshot (commits as artifact `jsonld-snapshot-updated`; copy into the repo manually)."
        type: boolean
        default: false

# Tune thresholds per branch by overriding these in repo/branch variables.
env:
  LH_PERF_MIN: ${{ vars.LH_PERF_MIN || '0.85' }}
  LH_A11Y_MIN: ${{ vars.LH_A11Y_MIN || '0.95' }}
  LH_SEO_MIN: ${{ vars.LH_SEO_MIN || '0.95' }}
  LH_LCP_MAX_MOBILE: ${{ vars.LH_LCP_MAX_MOBILE || '3500' }}
  LH_LCP_MAX_DESKTOP: ${{ vars.LH_LCP_MAX_DESKTOP || '2500' }}
  LH_TBT_MAX_MOBILE: ${{ vars.LH_TBT_MAX_MOBILE || '300' }}
  LH_TBT_MAX_DESKTOP: ${{ vars.LH_TBT_MAX_DESKTOP || '200' }}
  LH_CLS_MAX: ${{ vars.LH_CLS_MAX || '0.1' }}
  AXE_FAIL_ON: ${{ vars.AXE_FAIL_ON || 'critical' }}
  FORBIDDEN_TERMS_FILE: ${{ vars.FORBIDDEN_TERMS_FILE || '.quality/forbidden-terms.json' }}
  POST_JSONLD_DIFF: ${{ vars.POST_JSONLD_DIFF || '1' }}
  UPDATE_JSONLD_SNAPSHOT: ${{ (github.event_name == 'workflow_dispatch' && inputs.update_jsonld_snapshot) && '1' || (vars.UPDATE_JSONLD_SNAPSHOT || '') }}

jobs:
  a11y-content-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run typecheck
      - run: bunx playwright install --with-deps chromium
      - name: Validate forbidden-terms config + list active rules
        run: node scripts/validate-forbidden-terms.mjs
      - name: Audit /admin link references (must be 0)
        run: node scripts/audit-admin-links.mjs
      - name: Build production bundle (for bundle scan)
        env:
          LIGHTHOUSE_BUILD: "1"
          # Same as production, so the assistant contracts run against the real bundle.
          VITE_ASSISTANT_ENABLED: "true"
        run: bun run build
      - name: Start local Gemini and CRM stand-ins
        # tests/support/mock-gemini-server.mjs answers Gemini and the signed CRM
        # intake routes (/crm/init, /submit, /event, /talent) and records calls.
        run: |
          nohup node tests/support/mock-gemini-server.mjs > mock-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4599/calls > /dev/null && exit 0; sleep 0.5; done
          cat mock-server.log; exit 1
      - name: Run Playwright suite (a11y · content · SEO · bundle scan)
        env:
          CI: "1"
          A11Y_REPORT_DIR: a11y-report
          HOST: "127.0.0.1"
          PORT: "4175"
          PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
          GEMINI_API_KEY: ci-mock-key
          GEMINI_API_BASE: http://127.0.0.1:4599/models
          CRM_INTAKE_URL: http://127.0.0.1:4599/crm
          CRM_INTAKE_SECRET: test-crm-intake-secret-0123456789abcdef
        run: >-
          bunx playwright test
          --project=hero-a11y-chromium
          --project=hero-a11y-mobile-360
          --project=hero-high-contrast
      - name: Upload accessibility report (JSON + HTML)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with: { name: a11y-report, path: a11y-report }
      - name: Upload raw axe-core JSON reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: axe-raw-json
          path: a11y-report/*.json
          if-no-files-found: warn
      - name: Convert axe violations to SARIF
        if: always()
        run: node scripts/axe-to-sarif.mjs a11y-report a11y-report/axe.sarif
      - name: Upload SARIF artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: axe-sarif
          path: a11y-report/axe.sarif
          if-no-files-found: warn
      - name: Upload SARIF to GitHub code scanning
        # Enable after Code Scanning is active in repository settings.
        if: always() && vars.ENABLE_CODE_SCANNING_SARIF == '1'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: a11y-report/axe.sarif
          category: axe-core
      - name: Upload Playwright HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report }
      - name: Upload regenerated JSON-LD snapshot (workflow_dispatch only)
        if: always() && env.UPDATE_JSONLD_SNAPSHOT == '1'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jsonld-snapshot-updated
          path: tests/accessibility/__snapshots__/jsonld.snapshot.json
      - name: Show JSON-LD snapshot diff (UPDATE_JSONLD_SNAPSHOT only)
        if: always() && env.UPDATE_JSONLD_SNAPSHOT == '1'
        run: |
          mkdir -p jsonld-diff
          echo "### JSON-LD snapshot diff" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --no-color -- tests/accessibility/__snapshots__/jsonld.snapshot.json | tee jsonld-diff/jsonld.diff -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JSON-LD diff artifact (UPDATE_JSONLD_SNAPSHOT only)
        if: always() && env.UPDATE_JSONLD_SNAPSHOT == '1'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jsonld-snapshot-diff
          path: jsonld-diff/jsonld.diff
          if-no-files-found: warn
      - name: Print artifact links (SARIF + raw axe JSON)
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### Accessibility artifacts"
            echo ""
            echo "- 📦 Run artifacts (SARIF + raw axe JSON + reports): ${RUN_URL}#artifacts"
            echo "  - \`a11y-report\` — full JSON + HTML report"
            echo "  - \`axe-raw-json\` — raw axe-core JSON per page"
            echo "  - \`axe-sarif\` — SARIF export for code-scanning ingestion"
            echo "  - \`playwright-report\` — Playwright HTML report"
            if [[ "${{ vars.ENABLE_CODE_SCANNING_SARIF }}" == "1" ]]; then
              echo "- 🔎 Code scanning (axe SARIF): ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=tool%3Aaxe-core"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  safari-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps webkit
      - name: Validate Safari mobile layout and initial form position
        env:
          CI: "1"
        run: >-
          bunx playwright test
          tests/accessibility/webkit-mobile-layout.spec.ts
          --project=safari-mobile
      - name: Upload Safari mobile Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: safari-mobile-playwright-report
          path: playwright-report/a11y
          if-no-files-found: warn

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Render LHCI config with env thresholds
        run: node scripts/render-lhci-config.mjs lighthouserc.${{ matrix.form_factor }}.json lhci.runtime.json
      - name: Run Lighthouse CI (${{ matrix.form_factor }})
        run: bunx @lhci/cli@0.14.x autorun --config=./lhci.runtime.json
      - name: Upload Lighthouse report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ matrix.form_factor }}
          path: lighthouse-report/${{ matrix.form_factor }}

  visual-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Compare approved Windows desktop baselines
        env:
          CI: "1"
        run: bunx playwright test tests/accessibility/visual-regression.spec.ts --project=hero-a11y-chromium
      - name: Upload visual regression report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: playwright-report/a11y
          if-no-files-found: warn

  summarize:
    needs: [a11y-content-seo, safari-mobile, lighthouse, visual-regression]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: a11y-report, path: a11y-report }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: lighthouse-report-mobile, path: lighthouse-report/mobile }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: lighthouse-report-desktop, path: lighthouse-report/desktop }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: jsonld-snapshot-diff, path: jsonld-diff }
        continue-on-error: true
      - name: Build summary
        run: node scripts/summarize-quality.mjs
      - name: Upload combined HTML quality report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-html
          path: quality-report.html
          if-no-files-found: warn
      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-summary
          path: quality-summary.md
