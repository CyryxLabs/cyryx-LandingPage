name: Quality (a11y · content · SEO · Lighthouse)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_jsonld_snapshot:
        description: "Regenerate the schema.org JSON-LD snapshot (commits as artifact `jsonld-snapshot-updated`; copy into the repo manually)."
        type: boolean
        default: false

# Tune thresholds per branch by overriding these in repo/branch variables.
env:
  LH_PERF_MIN: ${{ vars.LH_PERF_MIN || '0.85' }}
  LH_A11Y_MIN: ${{ vars.LH_A11Y_MIN || '0.95' }}
  LH_SEO_MIN: ${{ vars.LH_SEO_MIN || '0.95' }}
  LH_LCP_MAX_MOBILE: ${{ vars.LH_LCP_MAX_MOBILE || '3500' }}
  LH_LCP_MAX_DESKTOP: ${{ vars.LH_LCP_MAX_DESKTOP || '2500' }}
  LH_TBT_MAX_MOBILE: ${{ vars.LH_TBT_MAX_MOBILE || '300' }}
  LH_TBT_MAX_DESKTOP: ${{ vars.LH_TBT_MAX_DESKTOP || '200' }}
  LH_CLS_MAX: ${{ vars.LH_CLS_MAX || '0.1' }}
  AXE_FAIL_ON: ${{ vars.AXE_FAIL_ON || 'critical' }}
  FORBIDDEN_TERMS_FILE: ${{ vars.FORBIDDEN_TERMS_FILE || '.quality/forbidden-terms.json' }}
  UPDATE_JSONLD_SNAPSHOT: ${{ (github.event_name == 'workflow_dispatch' && inputs.update_jsonld_snapshot) && '1' || (vars.UPDATE_JSONLD_SNAPSHOT || '') }}

jobs:
  a11y-content-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Validate forbidden-terms config + list active rules
        run: node scripts/validate-forbidden-terms.mjs
      - name: Build production bundle (for bundle scan)
        run: bun run build
      - name: Run Playwright suite (a11y · content · SEO · bundle scan)
        env:
          CI: "1"
          A11Y_REPORT_DIR: a11y-report
        run: bun run test:a11y
      - name: Upload accessibility report (JSON + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: a11y-report, path: a11y-report }
      - name: Upload raw axe-core JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-raw-json
          path: a11y-report/*.json
          if-no-files-found: warn
      - name: Convert axe violations to SARIF
        if: always()
        run: node scripts/axe-to-sarif.mjs a11y-report a11y-report/axe.sarif
      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: a11y-report/axe.sarif
          category: axe-core
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report }
      - name: Upload regenerated JSON-LD snapshot (workflow_dispatch only)
        if: always() && env.UPDATE_JSONLD_SNAPSHOT == '1'
        uses: actions/upload-artifact@v4
        with:
          name: jsonld-snapshot-updated
          path: tests/accessibility/__snapshots__/jsonld.snapshot.json
      - name: Show JSON-LD snapshot diff (UPDATE_JSONLD_SNAPSHOT only)
        if: always() && env.UPDATE_JSONLD_SNAPSHOT == '1'
        run: |
          echo "### JSON-LD snapshot diff" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --no-color -- tests/accessibility/__snapshots__/jsonld.snapshot.json | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Print artifact links (SARIF + raw axe JSON)
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### Accessibility artifacts"
            echo ""
            echo "- 🔎 Code scanning (axe SARIF): ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=tool%3Aaxe-core"
            echo "- 📦 Run artifacts (SARIF + raw axe JSON + reports): ${RUN_URL}#artifacts"
            echo "  - \`a11y-report\` — full JSON + HTML report"
            echo "  - \`axe-raw-json\` — raw axe-core JSON per page"
            echo "  - \`playwright-report\` — Playwright HTML report"
          } >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Render LHCI config with env thresholds
        run: node scripts/render-lhci-config.mjs lighthouserc.${{ matrix.form_factor }}.json lhci.runtime.json
      - name: Run Lighthouse CI (${{ matrix.form_factor }})
        run: bunx @lhci/cli@0.14.x autorun --config=./lhci.runtime.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ matrix.form_factor }}
          path: lighthouse-report/${{ matrix.form_factor }}

  summarize:
    needs: [a11y-content-seo, lighthouse]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: a11y-report, path: a11y-report }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: lighthouse-report-mobile, path: lighthouse-report/mobile }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: lighthouse-report-desktop, path: lighthouse-report/desktop }
        continue-on-error: true
      - name: Build summary
        run: node scripts/summarize-quality.mjs
      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-summary
          path: quality-summary.md